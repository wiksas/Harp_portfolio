<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nie znaleziono strony – Marry with Harp</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#49181e">
  <link rel="icon" href="/assets/img/icon-32.png" sizes="32x32">
  <!-- absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .not-found {
      min-height: 100svh; display: grid; place-content: center; gap: 1.2rem;
      padding: 2rem var(--gutter); text-align: center;
      background: var(--wine); color: var(--cream);
    }
    .not-found img { height: 90px; width: auto; margin: 0 auto; }
    .not-found h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); margin: 0; }
    .not-found .btn { justify-self: center; }
    .not-found p { margin: 0 auto 1rem; max-width: 30rem; color: color-mix(in srgb, var(--cream) 80%, transparent); }
  </style>
</head>
<body>
  <main class="not-found">
    <img src="/assets/img/logo-harfa.png" width="111" height="160" alt="">
    <p class="eyebrow">Błąd 404</p>
    <h1>Ta struna <em>nie gra</em></h1>
    <p>Nie znaleźliśmy tej strony. Wróć na stronę główną, aby posłuchać harfy i zarezerwować termin.</p>
    <a class="btn btn--gold" href="/">Strona główna</a>
  </main>
</body>
</html>
